[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quant-research-loop"
version = "0.4.0"
description = "PIT-aware read-only multi-agent research harness"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9,<3", "httpx>=0.27,<1", "python-dotenv>=1.0,<2", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
quant-research-loop = "src.cli:main"
quant-autoresearch = "src.social_campaign:main"
quant-paper-research = "src.autoresearch:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
