name: scheduled-research-fixture
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-batch
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Research demonstration - NOT live research
        run: python -m src.cli --demo --questions examples/questions.json --evidence examples/evidence.json --output runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-research-demo
          path: runs/
          if-no-files-found: warn
          retention-days: 14
